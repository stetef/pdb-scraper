search_parameters:
  metal_ion: "FE"
  # resolution_cutoff: 2.0
  # experimental_method: "X-RAY DIFFRACTION"
  polymer_type: null 

processing:
  batch_size: 75
  parallel_workers: 4
  rate_limit_delay: 0.1
  max_downloads: 15
  cutoff: 2.9
  selection_radius: 5.0
  target: "FE"
  metals_excluded: []
  must_have: ""
  include_waters: true

output:
  base_output_dir: "./data/p450-extended/"
  save_matching_structures: true

validation:
  coordination_distance_min: 2.0
  coordination_distance_max: 5.4
  # ligand_requirements:  # change for different ligand reqs
  #   - resname: CYS
  #     atom_names: [SG]
  #     count: 2
  #   - resname: HIS
  #     atom_names: [ND1, NE2]
  #     count: 2

input_mode: "list_file"
input_data: ["p450s.txt"]
log_level: "INFO"
