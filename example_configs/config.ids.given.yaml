# Configuration for the PDB Metalloprotein Pipeline

search_parameters:
  metal_ion: "ZN"
  resolution_cutoff: 2.0
  experimental_method: "X-RAY DIFFRACTION"
  polymer_type: null

processing:
  batch_size: 20
  parallel_workers: 4 # Note: current implementation is serial
  rate_limit_delay: 0.2 # seconds between downloads
  temp_directory: "./data/PDB-downloads"
  max_downloads: 40 # limit downloads for quick test runs (null = unlimited)
  cutoff: 3.0 # Angstroms, metal-to-metal clustering distance
  selection_radius: 6.0 # Angstroms, radius for selecting atoms around metals (includes full residues)
  target: "ZN" # Atom name for the central metal
  metals_excluded: []
  must_have: "S>=4" # Example: "S,N" or "S>=2"
  include_waters: true

output:
  results_database: "./data/results/summary.db"
  checkpoint_file: "./data/results/checkpoint.db"
  log_file: "./data/pipeline.log"
  save_matching_structures: true
  matched_structures_dir: "./data/results/validated_structures"
  output_dir: "./data/output"

validation:
  coordination_distance_max: 2.8
  coordination_distance_min: 2.0
  coord: "4S"

# Legacy/Manual input support
input_mode: "list_file"
input_data: ["example-ids.txt"] # List of PDB IDs or path to file with IDs
log_level: "INFO"